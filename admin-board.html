<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лис-А-Дом · Админка</title>
<style>
:root{--bg:#F2F2F7;--card:#FFFFFF;--text:#1C1C1E;--mut:#86868B;--mut2:#6E6E73;--line:rgba(60,60,67,.10);--blue:#007AFF;--green:#34C759;--orange:#FF9F0A;--red:#FF3B30;--purple:#AF52DE;--teal:#30B0C7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;padding:28px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#FFD60A,#FF9F0A);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(255,159,10,.35)}
.ttl h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px}
.ttl small{color:var(--mut);font-size:12px}
.seg{background:#E9E9EB;border-radius:11px;padding:2px;display:flex;margin-left:12px}
.seg button{border:none;background:transparent;padding:7px 14px;border-radius:9px;font-size:14px;color:var(--text);cursor:pointer}
.seg .cur{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.14);font-weight:600;cursor:default;min-width:130px}
.addbtn{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(0,122,255,.3)}
.addbtn:hover{background:#0066D6}
.logout{margin-left:auto;background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.35);padding:8px 18px;border-radius:10px;font-size:13px;font-weight:600;text-decoration:none;transition:.2s}
.logout:hover{background:rgba(239,68,68,.25);color:#fca5a5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{display:flex;align-items:center;gap:12px;padding:16px}
.kicon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.kpi b{display:block;font-size:20px;font-weight:700;letter-spacing:-.3px}
.kpi span{color:var(--mut);font-size:12px}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:800px){.row2{grid-template-columns:1fr}}
.chartcard{padding:18px 20px}
.chead{font-size:13px;font-weight:600;color:var(--mut2);margin-bottom:14px}
.chart{display:flex;align-items:flex-end;gap:12px;height:110px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.col .bar{background:linear-gradient(180deg,#6BB8FF,#007AFF);border-radius:7px 7px 3px 3px;min-height:4px}
.col b{font-size:11px;text-align:center;color:var(--mut2);font-weight:600}
.col span{font-size:11px;color:var(--mut);text-align:center}
.chips{display:flex;flex-direction:column;gap:10px}
.chip{display:flex;align-items:center;gap:10px;font-size:14px}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip b{margin-left:auto;font-weight:600}
.gridcard{padding:6px 0 0;margin-bottom:16px;overflow:hidden}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px}
.ghead b{font-size:15px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.gridwrap{overflow:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:center}
thead th{padding:10px 0;color:var(--mut);font-weight:600;font-size:12px}
thead th.we{color:var(--red)}
thead th.today{background:var(--blue);color:#fff;border-radius:8px}
td.name{text-align:left;padding:10px 14px;min-width:220px;border-right:1px solid var(--line);cursor:pointer}
td.name:hover{background:#F5F9FF}
td.name b{display:block;font-size:14px;font-weight:600}
td.name small{color:var(--mut);font-size:11px}
td.c{width:34px;height:42px;border:1px solid #F4F4F6;cursor:pointer}
td.c.we{background:#FAFAFC}
td.c.today{background:#F0F6FF}
td.c:hover{background:#E8F1FD}
td.b-pending{background:#FFF3E0;box-shadow:inset 0 0 0 1px rgba(255,159,10,.35)}
td.b-confirmed{background:#E3F0FF;box-shadow:inset 0 0 0 1px rgba(0,122,255,.35)}
td.b-paid{background:#E4F8EB;box-shadow:inset 0 0 0 1px rgba(52,199,89,.4)}
td.b-cancelled,td.b-rejected{background:#FFE9E9;box-shadow:inset 0 0 0 1px rgba(255,59,48,.3)}
td.b-avito{background:repeating-linear-gradient(45deg,#F6D3D3,#F6D3D3 4px,#FBEAEA 4px,#FBEAEA 8px)}
td.first{border-radius:9px 0 0 9px}
td.last{border-radius:0 9px 9px 0}
#details{display:none;margin-bottom:16px}
.dcard{padding:24px 26px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dhead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px}
.dsub{color:var(--mut);font-size:13px;margin-top:4px}
.close{width:30px;height:30px;border-radius:50%;border:none;background:rgba(60,60,67,.08);color:var(--mut2);font-size:17px;cursor:pointer;line-height:1}
.close:hover{background:rgba(255,59,48,.12);color:var(--red)}
.pill{color:#fff;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;margin-top:8px}
@media(max-width:800px){.dgrid{grid-template-columns:1fr}}
.row{display:flex;justify-content:space-between;gap:16px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
.row span{color:var(--mut)}
.row b{font-weight:600;text-align:right}
.sec{margin:16px 0 6px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--mut)}
.box{border-radius:12px;padding:12px 16px;margin:10px 0;font-weight:600;font-size:14px}
.box.ok{background:#E4F8EB;border:1px solid rgba(52,199,89,.5);color:#1B7E3E}
.box.no{background:#FFF3E0;border:1px solid rgba(255,159,10,.5);color:#B25E00}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{border:none;border-radius:11px;padding:11px 18px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(.94)}
.modal{display:none;position:fixed;inset:0;background:rgba(28,28,30,.35);backdrop-filter:blur(4px);z-index:50;align-items:center;justify-content:center}
.modal.open{display:flex}
.mcard{background:#fff;border-radius:20px;padding:26px;width:100%;max-width:430px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mcard h2{margin:0 0 14px;font-size:20px;font-weight:700}
.mcard label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.mcard input,.mcard select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#FBFBFD}
.mrow2{display:flex;gap:10px}.mrow2>div{flex:1}
.mbtns{display:flex;gap:10px;margin-top:18px}
</style>
<script>
(function(){
  fetch('/admin/api/auth-status').then(function(r){return r.json()}).then(function(j){
    if(!j || !j.authorized){ location.href='/admin/login'; }
  }).catch(function(){ location.href='/admin/login'; });
})();
</script>
</head>
<body>
<div class="top">
 <div class="logo">🦊</div>
 <div class="ttl"><h1>Лис-А-Дом</h1><small>админка бронирований</small></div>
 <div class="seg">
  <button onclick="shift(-1)">‹</button>
  <button class="cur" id="monthLabel">—</button>
  <button onclick="shift(1)">›</button>
 </div>
 <button class="addbtn" onclick="openCreate()">+ Бронь</button>
 <a class="logout" href="/admin/logout">⏻ Выйти</a>
</div>
<div class="kpis" id="stats"></div>
<div class="row2">
 <div class="card chartcard"><div class="chead">💰 Выручка по месяцам (подтверждённые и оплаченные)</div><div class="chart" id="chart"></div></div>
 <div class="card chartcard"><div class="chead">📊 Статусы броней</div><div class="chips" id="statusChips"></div></div>
</div>
<div class="card gridcard">
 <div class="ghead"><b>Календарь занятости</b>
  <div class="legend">
   <span><i style="background:#F6D3D3"></i>Авито закрыто</span>
   <span><i style="background:#FFF3E0"></i>Заявка</span>
   <span><i style="background:#E3F0FF"></i>Подтверждена</span>
   <span><i style="background:#E4F8EB"></i>Залог оплачен</span>
   <span><i style="background:#FFE9E9"></i>Отменена</span>
  </div>
 </div>
 <div class="gridwrap"><table id="grid"></table></div>
</div>
<div id="details"></div>
<div class="modal" id="modal">
 <div class="mcard">
  <h2>Новая бронь</h2>
  <label>Имя гостя</label><input id="fName">
  <label>Телефон</label><input id="fPhone">
  <div class="mrow2">
   <div><label>Заезд</label><input type="date" id="fIn"></div>
   <div><label>Выезд</label><input type="date" id="fOut"></div>
  </div>
  <div class="mrow2">
   <div><label>Гостей</label><input id="fGuests" value="2"></div>
   <div><label>Сумма, ₽</label><input id="fTotal" type="number"></div>
  </div>
  <div class="mrow2">
   <div><label>Статус</label><select id="fStatus"><option value="confirmed">Подтверждена</option><option value="pending">Заявка</option><option value="paid">Оплачена</option></select></div>
   <div><label>Источник</label><select id="fSource"><option value="manual">Вручную</option><option value="avito">Авито</option><option value="max_app">MAX</option></select></div>
  </div>
  <div class="mbtns">
   <button class="btn" style="background:#007AFF" onclick="createBooking()">Создать</button>
   <button class="btn" style="background:#8E8E93" onclick="closeModal()">Отмена</button>
  </div>
 </div>
</div>
<script>
let cur=new Date();let BOOKS=[];let AVITO=[];
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MD=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function iso(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function nextDay(s){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.totoISOStringFix();}
function prevDay(s){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');}
function fd(s){if(!s)return '—';const p=String(s).split('-');return parseInt(p[2])+' '+MD[parseInt(p[1])-1]+' '+p[0];}
function fdt(s){if(!s)return '—';const d=new Date(s);return fd(String(s).slice(0,10))+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
async function load(){const [r1,r2]=await Promise.all([fetch('/admin/api/bookings'),fetch('/admin/api/avito')]);BOOKS=await r1.json();AVITO=await r2.json();render();}
function shift(d){cur.setMonth(cur.getMonth()+d);render();}
function avitoHit(t){return (Array.isArray(AVITO)?AVITO:[]).find(ev=>t>=ev.start&&t<ev.end);}
function hideDetails(){document.getElementById('details').style.display='none';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();hideDetails();}});
function render(){
 const y=cur.getFullYear(),m=cur.getMonth();
 document.getElementById('monthLabel').textContent=MONTHS[m]+' '+y;
 const days=new Date(y,m+1,0).getDate();
 const today=new Date();const tISO=iso(today.getFullYear(),today.getMonth(),today.getDate());
 let head='<tr><th style="min-width:220px;text-align:left;padding-left:14px">Канал / Гость</th>';
 for(let d=1;d<=days;d++){const wd=new Date(y,m,d).getDay();head+='<th class="'+((wd===0||wd===6)?'we ':'')+(iso(y,m,d)===tISO?'today':'')+'">'+d+'</th>';}
 head+='</tr>';
 let av='<tr><td class="name" style="cursor:default"><b>🔒 Авито (закрыто)</b><small>синхронизация каждые 10 мин</small></td>';
 for(let d=1;d<=days;d++){const t=iso(y,m,d);const wd=new Date(y,m,d).getDay();const hit=avitoHit(t);av+='<td class="'+(hit?'b-avito first last':'c'+((wd===0||wd===6)?' we':'')+(t===tISO?' today':''))+'" style="'+(hit?'':'cursor:default')+'" title="'+(hit?esc(hit.summary):'')+'"></td>';}
 av+='</tr>';
 const lastDay=iso(y,m,days);
 const list=BOOKS.filter(b=>b.checkOut>iso(y,m,1)&&b.checkIn<=lastDay).sort((a,b)=>a.checkIn.localeCompare(b.checkIn));
 let rows='';
 list.forEach(b=>{
  rows+='<tr><td class="name" onclick="show(\''+b.id+'\')"><b>'+esc(b.name||'—')+'</b><small>'+b.id+' · '+b.checkIn.slice(8,10)+'.'+b.checkIn.slice(5,7)+' → '+b.checkOut.slice(8,10)+'.'+b.checkOut.slice(5,7)+'</small></td>';
  for(let d=1;d<=days;d++){
   const t=iso(y,m,d);const wd=new Date(y,m,d).getDay();
   let cls='c'+((wd===0||wd===6)?' we':'')+(t===tISO?' today':'');
   if(t>=b.checkIn&&t<b.checkOut){cls='b-'+(b.status||'pending');if(t===b.checkIn)cls+=' first';if(t===prevDay(b.checkOut))cls+=' last';}
   rows+='<td class="'+cls+'" onclick="cellClick(this,\''+t+'\')"></td>';
  }
  rows+='</tr>';
 });
 document.getElementById('grid').innerHTML=head+av+rows;
 const paid=list.filter(b=>b.status==='paid'||b.status==='confirmed');
 const nights=paid.reduce((s,b)=>s+(Number(b.nights)||0),0);
 const sum=paid.reduce((s,b)=>s+(Number(b.total)||0),0);
 const occ=new Set();paid.forEach(b=>{let t=b.checkIn;while(t<b.checkOut){occ.add(t);t=nextDay(t);}});
 let inMonth=0;for(let d=1;d<=days;d++){if(occ.has(iso(y,m,d)))inMonth++;}
 const avDays=new Set();for(let d=1;d<=days;d++){if(avitoHit(iso(y,m,d)))avDays.add(iso(y,m,d));}
 document.getElementById('stats').innerHTML=
 '<div class="card kpi"><div class="kicon" style="background:#E3F0FF">📅</div><div><b>'+list.length+'</b><span>броней в '+MONTHS[m].toLowerCase()+'</span></div></div>'+
 '<div class="card kpi"><div class="kicon" style="background:#E4F8EB">🌙</div><div><b>'+nights+'</b><span>ночей продано</span></div></div>'+
 '<div class="card kpi"><div class="kicon" style="background:#FFF3E0">💰</div><div><b>'+sum.toLocaleString('ru-RU')+' ₽</b><span>выручка месяца</span></div></div>'+
 '<div class="card kpi"><div class="kicon" style="background:#F3E8FF">📈</div><div><b>'+Math.round(inMonth/days*100)+'%</b><span>загрузка</span></div></div>'+
 '<div class="card kpi"><div class="kicon" style="background:#FFE9E9">🔒</div><div><b>'+avDays.size+'</b><span>дней закрыто на Авито</span></div></div>';
 renderAnalytics();
}
function renderAnalytics(){
 const now=new Date();let data=[];
 for(let i=5;i>=0;i--){
  const d=new Date(now.getFullYear(),now.getMonth()-i,1);
  const key=iso(d.getFullYear(),d.getMonth(),1).slice(0,7);
  const bs=BOOKS.filter(b=>(b.status==='paid'||b.status==='confirmed')&&String(b.checkIn||'').slice(0,7)===key);
  data.push({m:d.getMonth(),sum:bs.reduce((s,b)=>s+(Number(b.total)||0),0),n:bs.length});
 }
 const max=Math.max.apply(null,data.map(x=>x.sum).concat([1]));
 document.getElementById('chart').innerHTML=data.map(x=>'<div class="col" title="'+x.n+' броней · '+x.sum.toLocaleString('ru-RU')+' ₽"><b>'+(x.sum?Math.round(x.sum/1000)+'к':'')+'</b><div class="bar" style="height:'+Math.max(4,Math.round(x.sum/max*80))+'px"></div><span>'+MD[x.m]+'</span></div>').join('');
 const cnt=(s,c,l)=>'<div class="chip"><i class="dot" style="background:'+c+'"></i>'+l+'<b>'+BOOKS.filter(b=>(b.status||'pending')===s).length+'</b></div>';
 document.getElementById('statusChips').innerHTML=cnt('pending','#FF9F0A','Заявки')+cnt('confirmed','#007AFF','Подтверждённые')+cnt('paid','#34C759','Оплаченные')+cnt('cancelled','#FF3B30','Отменённые')+cnt('rejected','#FF3B30','Отклонённые');
}
function cellClick(el,t){if(!el.className.includes(' c'))return;openCreate(t);}
function openCreate(t){document.getElementById('modal').classList.add('open');if(t){document.getElementById('fIn').value=t;document.getElementById('fOut').value=nextDay(t);}}
function closeModal(){document.getElementById('modal').classList.remove('open');}
async function createBooking(){
 const body={name:document.getElementById('fName').value,phone:document.getElementById('fPhone').value,checkIn:document.getElementById('fIn').value,checkOut:document.getElementById('fOut').value,guests:document.getElementById('fGuests').value,total:document.getElementById('fTotal').value,status:document.getElementById('fStatus').value,source:document.getElementById('fSource').value};
 const r=await fetch('/admin/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json();
 if(d.ok){closeModal();load();}else{alert('Ошибка: '+(d.error||'неверные данные'));}
}
function show(id){
 const b=BOOKS.find(x=>x.id===id);if(!b)return;
 const st=b.status||'pending';
 const PILL={pending:['#FF9F0A','Заявка'],confirmed:['#007AFF','Подтверждена'],paid:['#34C759','Залог оплачен'],cancelled:['#FF3B30','Отменена'],rejected:['#FF3B30','Отклонена']};
 const pl=PILL[st]||PILL.pending;
 const CH={max_app:'MAX (мини-приложение)',manual:'Вручную (телефон)',avito:'Авито'};
 let btns='';
 if(st==='pending')btns+='<button class="btn" style="background:#34C759" onclick="setStatus(\''+b.id+'\',\'confirmed\')">✅ Подтвердить</button><button class="btn" style="background:#FF3B30" onclick="setStatus(\''+b.id+'\',\'rejected\')">❌ Отклонить</button>';
 else if(st==='confirmed')btns+='<a class="btn" style="background:#34C759" href="/api/act/paid/'+encodeURIComponent(b.id)+'" target="_blank">💰 Оплачено вручную</a><button class="btn" style="background:#FF3B30" onclick="setStatus(\''+b.id+'\',\'cancelled\')">❌ Отменить</button>';
 else if(st==='paid')btns+='<a class="btn" style="background:#8E8E93" href="/api/act/refund/'+encodeURIComponent(b.id)+'" target="_blank">💸 Возврат залога</a><a class="btn" style="background:#8E8E93" href="/api/act/refund/'+encodeURIComponent(b.id)+'/manual" target="_blank">🧾 Частичный</a><button class="btn" style="background:#FF3B30" onclick="setStatus(\''+b.id+'\',\'cancelled\')">❌ Отменить</button>';
 else btns+='<button class="btn" style="background:#007AFF" onclick="setStatus(\''+b.id+'\',\'pending\')">🔄 Вернуть в заявки</button>';
 if(b.paymentUrl)btns+='<a class="btn" style="background:#007AFF" href="'+b.paymentUrl+'" target="_blank">💳 Ссылка на оплату</a>';
 const row=(l,v)=>'<div class="row"><span>'+l+'</span><b>'+v+'</b></div>';
 const sec=t=>'<div class="sec">'+t+'</div>';
 document.getElementById('details').innerHTML='<div class="card dcard">'+
 '<div class="dhead"><div><h2>'+esc(b.name||'—')+'</h2><div class="dsub">'+b.id+' · забронировано '+fdt(b.created)+'</div></div>'+
 '<div style="display:flex;gap:10px;align-items:center"><span class="pill" style="background:'+pl[0]+'">'+pl[1]+'</span><button class="close" title="Закрыть" onclick="hideDetails()">✕</button></div></div>'+
 '<div class="dgrid"><div>'+
 sec('ГОСТЬ')+
 row('Телефон','<a href="tel:'+esc(b.phone||'')+'" style="color:#007AFF;text-decoration:none">'+esc(b.phone||'—')+'</a>')+
 row('Канал бронирования',CH[b.source]||b.source||'MAX')+
 row('Гостей',esc(b.guests||'—'))+
 (b.comment?row('Комментарий',esc(b.comment)):'')+
 sec('ПРОЖИВАНИЕ')+
 row('Заезд',fd(b.checkIn)+', с 15:00')+
 row('Выезд',fd(b.checkOut)+', до 12:00')+
 row('Ночей',b.nights||1)+
 '</div><div>'+
 sec('ОПЛАТА')+

<script>
(function autoLogout(){
  var TIMEOUT = 12 * 60 * 60 * 1000; // 12 часов
  var WARN_BEFORE = 5 * 60 * 1000;   // предупреждение за 5 минут
  var timer, warnTimer;
  function reset(){
    clearTimeout(timer); clearTimeout(warnTimer);
    var w = document.getElementById('autologout-warn');
    if(w) w.style.display='none';
    warnTimer = setTimeout(function(){
      var w = document.getElementById('autologout-warn');
      if(w) w.style.display='flex';
    }, TIMEOUT - WARN_BEFORE);
    timer = setTimeout(function(){
      fetch('/admin/logout').then(function(){ location.href='/admin/login'; });
    }, TIMEOUT);
  }
  ['mousemove','keydown','click','scroll','touchstart'].forEach(function(e){
    document.addEventListener(e, reset, {passive:true});
  });
  // плашка предупреждения
  if(!document.getElementById('autologout-warn')){
    var d = document.createElement('div');
    d.id='autologout-warn';
    d.style.cssText='display:none;position:fixed;top:20px;right:20px;background:#FEF3C7;border:2px solid #F59E0B;color:#78350F;padding:14px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:99999;box-shadow:0 10px 30px rgba(0,0,0,.15)';

  reset();
})();

<script>
/* === v6: маска телефона + единый формат +7999-123-45-67 === */
(function(){
 window.maskDigits=function(d){
  d=String(d).replace(/\D/g,'');
  if(d.length===11&&(d[0]==='7'||d[0]==='8'))d=d.slice(1);
  d=d.slice(0,10);
  let out='+7';
  if(d.length)out+=d.slice(0,3);
  if(d.length>3)out+='-'+d.slice(3,6);
  if(d.length>6)out+='-'+d.slice(6,8);
  if(d.length>8)out+='-'+d.slice(8,10);
  return out;
 };
 window.normTel=function(s){
  let d=String(s||'').replace(/\D/g,'');
  if(d.length===11&&(d[0]==='8'||d[0]==='7'))d='7'+d.slice(1);
  if(d.length===10&&d[0]==='9')d='7'+d;
  return (d.length===11&&d[0]==='7')?'+'+d:String(s||'');
 };
 window.fmtPhone=function(s){
  let d=String(s||'').replace(/\D/g,'');
  if(d.length===11&&d[0]==='7')return maskDigits(d.slice(1));
  if(d.length===10)return maskDigits(d);
  return String(s||'—');
 };
 window.attachPhoneMask=function(el){
  if(!el||el.dataset.masked)return;el.dataset.masked='1';
  el.addEventListener('input',function(){
   const d=el.value.replace(/\D/g,'');
   el.value=d?maskDigits(d):'';
  });
  el.addEventListener('keydown',function(e){
   if(e.key==='Backspace'&&/-$/.test(el.value)){
    e.preventDefault();
    const d=el.value.replace(/\D/g,'').slice(0,-1);
    el.value=d?maskDigits(d):'';
   }
  });
 };
 const oc=window.openCreate;
 window.openCreate=function(t){oc(t);attachPhoneMask(document.getElementById('fPhone'));};
 const sh=window.show;
 window.show=function(id){
  sh(id);
  document.querySelectorAll('#bookModal a[href^="tel:"]').forEach(a=>{a.href='tel:'+normTel(a.textContent);a.textContent=fmtPhone(a.textContent);});
 };
 const lg=window.loadGuests;
 window.loadGuests=async function(){
  await lg();
  document.querySelectorAll('#gTable a[href^="tel:"]').forEach(a=>{a.href='tel:'+normTel(a.textContent);a.textContent=fmtPhone(a.textContent);});
 };
})();

 };
